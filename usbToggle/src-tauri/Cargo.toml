[package]
name = "usbToggle"
version = "1.0.0"
description = "USB device toggle tray utility"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "usbToggle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.7.4", features = ["tray-icon"] }
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
