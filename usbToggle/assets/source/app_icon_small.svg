<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3446"/><stop offset="1" stop-color="#0f131b"/></linearGradient>
  <linearGradient id="track" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4db4ff"/><stop offset="1" stop-color="#0f6cd8"/></linearGradient>
  <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3eaf4"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect x="4" y="4" width="92" height="92" rx="22" fill="url(#tile)"/>
<rect x="4.6" y="4.6" width="90.8" height="90.8" rx="21.4" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1.2"/>

<rect x="10" y="30" width="80" height="40" rx="20" fill="url(#track)"/>
<rect x="10" y="30" width="80" height="40" rx="20" fill="url(#shine)"/>
<circle cx="69" cy="50" r="16" fill="url(#knob)" filter="url(#shadow)"/>
</svg>