# ===========================================================================
#  apps.ini  -  which app should open which file types
#
#  Each app is a [section]. Lines starting with # are comments.
#
#    exe          where the program is installed (repeat the line to try
#                 several places; the first one that exists is used).
#                 %ProgramFiles% and similar variables are fine.
#    extensions   file types, separated by spaces (repeat the line if long).
#    enabled      yes / no   (default yes). Use "no" to switch an app off.
#
#  Optional:
#    icon-prefix  If the app registers its own file types (PotPlayer does, when
#                 you use its File Association settings), write the start of
#                 their names here so its own icons are used. Example: PotPlayer
#    progid       Only needed if you want to choose the ProgID name yourself.
#    perceived-type
#                 Windows shows the file TYPE on hover. It reads that from the
#                 ProgID, so the app gets its own per-extension ProgIDs that copy
#                 the type info Windows already knows (e.g. .png -> "PNG Image").
#                 Set this for the ones Windows has no type for: image, audio,
#                 video, document, text, archive. Leave blank if unsure.
#
#  Apps like Word that already have their own ProgIDs: just write
#       docx = Word.Document.12
#  (any "name = value" line that is not one of the keys above is read as
#   "file type = ProgID"). To find a ProgID, set the default by hand once, then
#  run in PowerShell:   . .\SFTA.ps1 ; Get-FTA .docx
#
#  To add an app: copy a whole block, change the name, exe and extensions.
# ===========================================================================

[PotPlayer]
exe = %ProgramFiles%\DAUM\PotPlayer\PotPlayerMini64.exe
exe = %ProgramFiles(x86)%\DAUM\PotPlayer\PotPlayerMini64.exe
exe = %ProgramFiles%\DAUM\PotPlayer\PotPlayerMini.exe
exe = %ProgramFiles(x86)%\DAUM\PotPlayer\PotPlayerMini.exe
icon-prefix = PotPlayer
extensions = xspf xss wma wmp wmv wmx wtv wv wvx usf vob
extensions = vtt wav wax webm wm tak tp tpr trp ts tta ttml skm smi srt ssa ssf
extensions = sub sup ra ram rm rmvb rpm rt sbv ogm ogv opus pbf pls psb qt mpv2
extensions = mqv mts mxf nsr nsv ogg mpc mpd mpe mpeg mpg mpl mpls mod mov mp2
extensions = mp2v mp3 mp4 mpa m3u8 m4a m4b m4p m4v mka mkv m1a m1v m2a m2t m2ts
extensions = m2v m3u f4v flac flv idx ifo k3g lmp4 dpl dsf dts dtshd dvr-ms eac3
extensions = evo asx avi cda cue divx dmskm dpg amr amv ape asf ass 3g2 3gp 3gp2
extensions = 3gpp aac ac3 aif aiff

[FastStone Image Viewer]
exe = %ProgramFiles(x86)%\FastStone Image Viewer\FSViewer.exe
exe = %ProgramFiles%\FastStone Image Viewer\FSViewer.exe
perceived-type = image
extensions = jpg jpeg jpe jfif png gif bmp dib tif tiff webp ico tga psd heic heif avif jxl jp2 j2k pcx pbm pgm ppm wbmp
extensions = cr2 cr3 crw nef nrw arw sr2 srf dng orf rw2 raf pef srw 3fr erf kdc mrw x3f dcr rwl hif svg wmf


# ---------------------------------------------------------------------------
#  Ready-made blocks, switched off. Change "enabled = no" to "enabled = yes"
#  to use one. NOT tested - check the ProgIDs with Get-FTA first.
# ---------------------------------------------------------------------------

[Microsoft Word]
enabled = no
exe = %ProgramFiles%\Microsoft Office\root\Office16\WINWORD.EXE
exe = %ProgramFiles(x86)%\Microsoft Office\root\Office16\WINWORD.EXE
docx = Word.Document.12
doc = Word.Document.8
docm = Word.DocumentMacroEnabled.12
dotx = Word.Template.12
rtf = Word.RTF.8

[Microsoft Excel]
enabled = no
exe = %ProgramFiles%\Microsoft Office\root\Office16\EXCEL.EXE
exe = %ProgramFiles(x86)%\Microsoft Office\root\Office16\EXCEL.EXE
xlsx = Excel.Sheet.12
xls = Excel.Sheet.8
xlsm = Excel.SheetMacroEnabled.12
xlsb = Excel.SheetBinaryMacroEnabled.12
csv = Excel.CSV

[Microsoft PowerPoint]
enabled = no
exe = %ProgramFiles%\Microsoft Office\root\Office16\POWERPNT.EXE
exe = %ProgramFiles(x86)%\Microsoft Office\root\Office16\POWERPNT.EXE
pptx = PowerPoint.Show.12
ppt = PowerPoint.Show.8
pptm = PowerPoint.ShowMacroEnabled.12
ppsx = PowerPoint.SlideShow.12

# Windows may refuse to change the .pdf default from a script.
[Adobe Acrobat]
enabled = no
exe = %ProgramFiles%\Adobe\Acrobat DC\Acrobat\Acrobat.exe
exe = %ProgramFiles(x86)%\Adobe\Acrobat DC\Acrobat\Acrobat.exe
pdf = Acrobat.Document.DC
